services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recovery_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/recovery_crm
      - VALKEY_URL=redis://valkey:6379/0
      - SECRET_KEY=replace-this-production-secret-key-minimum-32-chars
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: recovery_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=recovery_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recovery_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: recovery_valkey
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
